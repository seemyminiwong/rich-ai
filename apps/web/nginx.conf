# Схема ОРИГІНАЛЬНОГО запиту. Cloudflare терминує TLS у себе, до нас усе
# приходить по http, тому $scheme завжди сказав би "http" - і будь-яка
# абсолютна адреса, зібрана з запиту (OAuth redirect_uri), поїхала б на http://
# на https-сторінці. У LAN заголовка немає, і тоді $scheme - правильна відповідь.
# Значення заголовка - рівно "https" або "http", тому звичайне порівняння:
# регулярка тут дала б лише зайвий спосіб помилитись. Порожньо або будь-що
# інше (ланцюжок проксі) - обережний відкат на $scheme.
map $http_x_forwarded_proto $forwarded_scheme {
  default $scheme;
  https   https;
  http    http;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Стеля тіла запиту мусить бути НЕ МЕНШОЮ за ту, що перевіряє API (30 МБ у
  # /api/uploads/image). Інакше 25-мегабайтне фото відсікає nginx, і оператор
  # бачить голий 413 замість зрозумілого повідомлення студії.
  client_max_body_size 32m;

  # За Cloudflare Tunnel $remote_addr - це адреса контейнера cloudflared, одна
  # на ВСІХ відвідувачів. Ліміт входу «30 спроб на IP за 5 хвилин» тоді рахує
  # всіх разом: один перебірник блокує решту, а справжнього зловмисника не
  # видно. Справжня адреса приходить у CF-Connecting-IP.
  #
  # Довіряємо лише приватним мережам: у LAN-запиті на порт 3000 такого
  # заголовка немає, тож підмінити свій IP ззовні неможливо.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # Ім'я `api` МУСИТЬ перерезолвлюватись на кожен запит. Зі статичним
  # `proxy_pass http://api:8000` nginx резолвить його один раз при старті і
  # тримає той IP до кінця життя воркера; після `docker compose up -d api`
  # контейнер отримує НОВИЙ IP, і web довбиться в мертву адресу - 502 на все,
  # хоча API здоровий (жива аварія 29.08: `/health` зсередини 200, ззовні 502,
  # web підняли 2 дні тому і більше не чіпали). Змінна в proxy_pass вимикає
  # разовий резолв; 127.0.0.11 - вбудований DNS docker-мережі.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  # Без URI в змінній nginx передає оригінальний request_uri як є - тобто
  # рівно та сама маршрутизація, що й була.
  set $api_upstream http://api:8000;
  set $api_health http://api:8000/health;

  # nginx only inherits add_header into a location that declares none of its own,
  # so any location below that sets Cache-Control must repeat these three.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "same-origin" always;

  # ^~ обовʼязкове, як і для /media/: без нього regex-локація кешу нижче
  # перехоплює БУДЬ-ЯКУ адресу API, що закінчується на .png/.svg/.js/.css,
  # і віддає 404 зі статики. Жива аварія: /api/infographic/icon/<slug>.png -
  # прев'ю іконок не вантажились узагалі, а перша діагностика списала це на
  # 401 і зняла авторизацію, хоча запит до API просто не доходив.
  location ^~ /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_read_timeout 2400s;
  }

  # ^~ is load-bearing: a plain prefix location LOSES to the regex cache
  # location below, so /media/<project>/product-reference.png was served by
  # try_files from the static root and 404'd (broken reference frame in the
  # studio, 2026-08-21). Only .webp survived because webp is not in that
  # regex. ^~ stops nginx from ever testing the regex for /media/.
  location ^~ /media/ {
    proxy_pass $api_upstream;
    proxy_read_timeout 300s;
    # Product images are embedded into sandboxed previews and, eventually, public
    # product pages: explicitly allow any embedding context to load them.
    # add_header here breaks inheritance, so the security trio is repeated.
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
  }

  # ^~ з тієї ж причини, що й у /media/ та /api/: regex-локація кешу нижче
  # інакше перехопить будь-який .png/.css/.svg усередині лендінгу і віддасть
  # 404 зі статичного кореня. Лендінг живе на bind-mount, тому вміст міняється
  # без перезбирання образу — кеш вимкнено, щоб браузер не показував учорашню
  # версію після git pull. add_header тут рве успадкування, тож трійка безпеки
  # повторюється.
  location ^~ /landings/ {
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    autoindex on;
    try_files $uri $uri/ =404;
  }

  location = /health {
    proxy_pass $api_health;
  }

  # Cache busting hangs off index.html staying fresh: the ?b= query on app.js only
  # reaches the browser if it re-reads the shell. With no Cache-Control at all,
  # browsers apply heuristic caching to it and keep serving yesterday's bundle.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri =404;
  }

  location ~* \.(js|css|png|svg|ico|webmanifest)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
