# Публічна роздача лендінгів. Окремий контейнер із власним коренем: назовні
# їде РІВНО папка promo/ і нічого більше — ані студія, ані /api, ані /media.
# Саме тому public hostname тунелю має вказувати на `promo:80`, а не на
# `web:80`: інакше разом із лендінгом у публічний доступ виїжджає вся студія.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Реальна адреса відвідувача замість IP контейнера cloudflared — щоб у логах
  # було видно, хто саме відкривав сторінку.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # Сторінка оновлюється через git pull без перезбирання образу, тому кеш
  # вимкнено: інакше після правки колега бачить учорашню версію.
  add_header Cache-Control "no-store, must-revalidate" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  # X-Frame-Options свідомо НЕ ставимо: лендінг має відкриватись у прев'ю
  # месенджерів і в iframe на боці замовника.

  # Список усіх промо-сторінок на випадок, коли адресу конкретного файлу забули.
  location = / {
    autoindex on;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
