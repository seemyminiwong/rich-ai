<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="ARTLINE Rich Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="0.6" stop-color="#1A2128"/>
      <stop offset="1" stop-color="#16232A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#19BCC9" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#19BCC9" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#19BCC9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>
  <style>
    /* Той самий настрій, що на екрані входу: мʼяке дихання світіння і
       мерехтіння пікселів. prefers-reduced-motion вимикає рух. */
    @keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes blink{0%,100%{opacity:var(--lo)}50%{opacity:var(--hi)}}
    .glow{animation:glowPulse 5.4s ease-in-out infinite}
    .px{animation:blink var(--d) ease-in-out infinite;animation-delay:var(--s)}
    @media (prefers-reduced-motion:reduce){.glow,.px{animation:none}}
  </style>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#frame)"><rect class="glow" width="1200" height="300" fill="url(#glow)"/></g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="23.5" fill="none" stroke="#35393F"/>
